# Baseline rules: SDK Dependabot Bot project, see the rules page.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  # Example apps are security-only: open-pull-requests-limit 0 turns off
  # version updates but keeps security updates. The example is pinned to its
  # framework versions and moves by hand with the SDK.
  - package-ecosystem: bundler
    directories:
      - /example/ios
      - /example/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    groups:
      bundler-example-security:
        applies-to: security-updates
        patterns:
          - "*"
  # The plugin's Dart packages. `logging` and `meta` are resolved into
  # customers' apps; the rest are dev tooling.
  - package-ecosystem: pub
    directories:
      - /
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    commit-message:
      prefix: chore
      include: scope
    groups:
      pub-shipped-minor-patch:
        applies-to: version-updates
        patterns:
          - logging
          - meta
        update-types:
          - minor
          - patch
      pub-shipped-security:
        applies-to: security-updates
        patterns:
          - logging
          - meta
      pub-tooling-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - logging
          - meta
        update-types:
          - minor
          - patch
      pub-tooling-security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - logging
          - meta
  # Example app: security-only, as above.
  - package-ecosystem: pub
    directories:
      - /example
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    groups:
      pub-example-security:
        applies-to: security-updates
        patterns:
          - "*"
  # The Android plugin module. Kotlin and Firebase Messaging are compiled into
  # customers' apps; AGP and the test libraries are build tooling.
  - package-ecosystem: gradle
    directories:
      - /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle-shipped-minor-patch:
        applies-to: version-updates
        patterns:
          - "org.jetbrains.kotlin:*"
          - "com.google.firebase:*"
        update-types:
          - minor
          - patch
      gradle-shipped-security:
        applies-to: security-updates
        patterns:
          - "org.jetbrains.kotlin:*"
          - "com.google.firebase:*"
      gradle-tooling-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "org.jetbrains.kotlin:*"
          - "com.google.firebase:*"
        update-types:
          - minor
          - patch
      gradle-tooling-security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "org.jetbrains.kotlin:*"
          - "com.google.firebase:*"
    ignore:
      # Bumped by hand at release.
      - dependency-name: "com.github.klaviyo.klaviyo-android-sdk:*"
      # Held until the plugin moves to Kotlin 2. Remove in that change.
      # Covers the `kotlin_version` property PR: Dependabot updates it through
      # kotlin-gradle-plugin and kotlin-stdlib-jdk7, which both match.
      - dependency-name: "org.jetbrains.kotlin:*"
        update-types:
          - "version-update:semver-major"
      # Held until the build moves to AGP 9. Remove in that change.
      - dependency-name: "com.android.tools.build:gradle"
        update-types:
          - "version-update:semver-major"
  # Example app: security-only, as above.
  - package-ecosystem: gradle
    directories:
      - /example/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle-example-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Bumped by hand at release.
      - dependency-name: "com.github.klaviyo.klaviyo-android-sdk:*"
