name: release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Verify running from a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Error: This workflow must be run from a tag, not a branch."
          echo "When using 'Run workflow', select a tag from the Tags tab."
          exit 1

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Validate release files exist
        run: |
          if [ ! -f "CHANGELOG.md" ]; then
            echo "Error: CHANGELOG.md not found"
            exit 1
          fi

  publish:
    needs: validate
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the version on pub.dev
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          url="https://pub.dev/api/packages/klaviyo_flutter_sdk/versions/${VERSION}"
          for attempt in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$status" = "200" ]; then
              echo "klaviyo_flutter_sdk ${VERSION} is live on pub.dev"
              exit 0
            fi
            echo "Attempt ${attempt}/20: pub.dev returned ${status}; retrying in 15s"
            sleep 15
          done
          echo "::error::klaviyo_flutter_sdk ${VERSION} did not appear on pub.dev within 5 minutes"
          exit 1

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists; skipping creation"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            CHANGELOG.md

  notify:
    needs: [validate, publish, verify, github-release]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Summarize result
        id: result
        env:
          VALIDATE: ${{ needs.validate.result }}
          PUBLISH: ${{ needs.publish.result }}
          VERIFY: ${{ needs.verify.result }}
          GITHUB_RELEASE: ${{ needs.github-release.result }}
        run: |
          failed=""
          [ "$VALIDATE" = "success" ] || failed="validate (${VALIDATE})"
          [ -n "$failed" ] || [ "$PUBLISH" = "success" ] || failed="publish (${PUBLISH})"
          [ -n "$failed" ] || [ "$VERIFY" = "success" ] || failed="pub.dev verify (${VERIFY})"
          [ -n "$failed" ] || [ "$GITHUB_RELEASE" = "success" ] || failed="GitHub release (${GITHUB_RELEASE})"
          if [ -z "$failed" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "failed_step=${failed}" >> "$GITHUB_OUTPUT"
          fi
          echo "commit_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: ${{ steps.result.outputs.result }}
          title: klaviyo_flutter_sdk ${{ github.ref_name }} → pub.dev
          version_heading: Version
          version_label: ${{ github.ref_name }}
          release_url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          access_url: ${{ steps.result.outputs.result == 'success' && format('https://pub.dev/packages/klaviyo_flutter_sdk/versions/{0}', github.ref_name) || '' }}
          access_label: pub.dev
          event_name: ${{ github.event_name }}
          commit_sha: ${{ github.sha }}
          commit_short: ${{ steps.result.outputs.commit_short }}
          failed_step: ${{ steps.result.outputs.failed_step }}
