name: Notify Slack of example app publish result
description: Posts a Slack message summarizing an example app publish job (success or failure).
inputs:
  webhook:
    description: Slack incoming webhook URL
    required: true
  result:
    description: "'success' or 'failure', drives icon and headline"
    required: true
  platform:
    description: "Human-readable platform label (e.g. 'Play Store', 'TestFlight')"
    required: true
  version_label:
    description: Version string to show in the message (e.g. 'X.Y.Z (build)')
    required: false
    default: '?'
  source_label:
    description: Sanitized branch or release tag the build came from
    required: false
    default: ''
  sdk_info:
    description: >-
      Pre-formatted SDK refs line, e.g. "Flutter: a@b · iOS: 5.4.1 · Android:
      4.5.1" (from scripts/sdk-ref.sh).
    required: false
    default: ''
  access_url:
    description: >-
      Where testers get the build. This repo is public, so only pass links that
      require an authorized Play tester / App Store Connect account to resolve;
      never a direct artifact or public TestFlight link.
    required: false
    default: ''
  access_label:
    description: Link text for access_url
    required: false
    default: Open build
  install_notes:
    description: >-
      Extra install guidance appended to the access line (e.g. TestFlight
      processing time, tester-list requirement).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Skip when no webhook is configured
      if: inputs.webhook == ''
      shell: bash
      run: echo "::warning::SLACK_WEBHOOK_URL is not set; skipping Slack notification"

    - if: inputs.webhook != ''
      uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ inputs.result == 'success' && '✅' || '🚨' }} Flutter SDK Example App: ${{ inputs.platform }} ${{ inputs.result == 'success' && 'publish succeeded' || 'publish failed' }}"
          blocks:
            - type: "header"
              text:
                type: "plain_text"
                text: "${{ inputs.result == 'success' && '✅' || '🚨' }} Flutter SDK Example App: ${{ inputs.platform }} ${{ inputs.result == 'success' && 'publish succeeded' || 'publish failed' }}"
            - type: "section"
              text:
                type: "mrkdwn"
                text: "*Repository:* ${{ github.repository }}\n*Trigger:* ${{ github.event_name }}${{ inputs.source_label != '' && format(' on `{0}`', inputs.source_label) || '' }}\n*Version:* `${{ inputs.version_label }}`${{ inputs.sdk_info != '' && format('\n*SDKs:* `{0}`', inputs.sdk_info) || '' }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>\n*Author:* ${{ github.actor }}${{ inputs.access_url != '' && format('\n*Get the build:* <{0}|{1}> (requires tester access)', inputs.access_url, inputs.access_label) || '' }}${{ inputs.install_notes != '' && format('\n{0}', inputs.install_notes) || '' }}"
            - type: "section"
              text:
                type: "mrkdwn"
                text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
