name: Notify Slack of example app publish result
description: Posts a Slack message summarizing an example app publish job (success or failure).
inputs:
  webhook:
    description: Slack incoming webhook URL
    required: true
  result:
    description: "'success' or 'failure', drives icon and headline"
    required: true
  platform:
    description: "Human-readable platform label (e.g. 'Play Store', 'TestFlight')"
    required: true
  version_label:
    description: Version string to show in the message (e.g. 'X.Y.Z (build)')
    required: false
    default: '?'
  access_url:
    description: >-
      Where testers get the build. This repo is public, so only pass links that
      require an authorized Play tester / App Store Connect account to resolve;
      never a direct artifact or public TestFlight link.
    required: false
    default: ''
  access_label:
    description: Link text for access_url
    required: false
    default: Open build

runs:
  using: composite
  steps:
    - name: Skip when no webhook is configured
      if: inputs.webhook == ''
      shell: bash
      run: echo "::warning::SLACK_WEBHOOK_URL is not set; skipping Slack notification"

    - if: inputs.webhook != ''
      uses: slackapi/slack-github-action@v2.1.1
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ inputs.result == 'success' && '✅' || '🚨' }} Flutter SDK Example App: ${{ inputs.platform }} ${{ inputs.result == 'success' && 'publish succeeded' || 'publish failed' }}"
          blocks:
            - type: "header"
              text:
                type: "plain_text"
                text: "${{ inputs.result == 'success' && '✅' || '🚨' }} Flutter SDK Example App: ${{ inputs.platform }} ${{ inputs.result == 'success' && 'publish succeeded' || 'publish failed' }}"
            - type: "section"
              text:
                type: "mrkdwn"
                text: "*Repository:* ${{ github.repository }}\n*Trigger:* ${{ github.event_name }} on `${{ github.ref_name }}`\n*Version:* `${{ inputs.version_label }}`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>\n*Author:* ${{ github.actor }}${{ inputs.access_url != '' && format('\n*Get the build:* <{0}|{1}> (requires tester access)', inputs.access_url, inputs.access_label) || '' }}"
            - type: "section"
              text:
                type: "mrkdwn"
                text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
