reviews:
  profile: assertive
  path_filters:
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!**/*.mocks.dart"
    - "!**/pubspec.lock"
    - "!**/Pods/**"
    - "!**/*.xcodeproj/**"
  auto_review:
    drafts: false
    base_branches:
      - ".*"
  tools:
    swiftlint:
      enabled: true
      config_file: "ios/.swiftlint.yml"

  path_instructions:
    - path: "**"
      instructions: |
        # AI Agent Guidelines
        
        See `AGENTS.md` in the repository root for the full context file covering:
        
        - Role persona & project intro
        - Build, test, and lint commands
        - Architecture overview & module structure
        - Code style conventions & pre-commit hooks
        - Gotchas specific to this Flutter SDK
        
        All guidance in `AGENTS.md` applies to Cursor as well.
