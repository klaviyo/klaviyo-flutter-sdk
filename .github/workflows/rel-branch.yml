name: Release Branch

# Creates a rel/X.Y.Z branch from base (default master) containing the version bump commit.
# Does nothing if that branch already exists. Opens a draft PR from it into master if it has none.
#
# Run by hand or from the CLI (gh workflow run rel-branch.yml -f bump=minor).
#
# The weekday schedule (13:00 UTC, Mon-Fri) runs with the defaults: bump=minor, steps=1, base=master.
# That keeps a branch for the next minor release open: e.g. with 0.5.0 released it creates rel/0.6.0,
# and no-ops until 0.6.0 is tagged, then creates rel/0.7.0 the next weekday morning.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest stable version to increment
        type: choice
        options: [patch, minor, major]
        default: minor
      steps:
        description: How many increments past the latest stable release
        type: number
        default: 1
      version:
        description: Explicit X.Y.Z, overrides bump and steps
        type: string
        required: false
      base:
        description: Branch, tag or sha to cut from
        type: string
        required: false
        default: master
      triggered_by:
        description: Person to credit in Slack when another workflow starts this one
        type: string
        required: false
      android:
        description: Android SDK version or rel/* branch to pin
        type: string
        required: false
        default: ''
      ios:
        description: iOS SDK version or rel/* branch to pin
        type: string
        required: false
        default: ''
  schedule:
    - cron: '0 13 * * 1-5'

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  SLACK_USERNAME: Flutter SDK
  SLACK_ICON_EMOJI: ':merlin-orb-flutter:'
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898333+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898333+github-actions[bot]@users.noreply.github.com

concurrency:
  group: rel-branch
  cancel-in-progress: false

jobs:
  rel_branch:
    name: Create release branch
    uses: klaviyo/klaviyo-react-native-sdk/.github/workflows/rel-branch-core.yml@master
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets: inherit
    with:
      bump: ${{ inputs.bump || 'minor' }}
      steps: ${{ github.event_name != 'workflow_dispatch' && 1 || inputs.steps }}
      version: ${{ inputs.version }}
      base: ${{ inputs.base || 'master' }}
      triggered_by: ${{ inputs.triggered_by }}
      sdk-name: Flutter SDK
      slack-username: Flutter SDK
      slack-icon-emoji: ':merlin-orb-flutter:'
      bump-command: ./scripts/bump_version.sh "$VERSION"

  pin:
    name: Pin native SDKs
    needs: rel_branch
    if: success() && (inputs.android != '' || inputs.ios != '')
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.rel_branch.outputs.version }}
      BRANCH: ${{ needs.rel_branch.outputs.branch }}
      PIN_BRANCH: chore/pin-natives-${{ needs.rel_branch.outputs.version }}
      ANDROID: ${{ inputs.android }}
      IOS: ${{ inputs.ios }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.X_REPO_PAT }}
          ref: ${{ needs.rel_branch.outputs.branch }}
          fetch-depth: 0

      - name: Continue an open pin branch
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "refs/heads/$PIN_BRANCH" > /dev/null; then
            git fetch --quiet origin "+refs/heads/$PIN_BRANCH:refs/remotes/origin/$PIN_BRANCH"
            git switch -c "$PIN_BRANCH" "origin/$PIN_BRANCH"
            git merge --no-edit "origin/$BRANCH"
            echo "Continuing $PIN_BRANCH so earlier pins are kept"
          else
            git switch -c "$PIN_BRANCH"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Pin native SDKs
        run: |
          set -euo pipefail

          args=()
          if [ -n "$ANDROID" ]; then
            args+=("--android-$([[ "$ANDROID" == rel/* ]] && echo branch || echo version)" "$ANDROID")
          fi
          if [ -n "$IOS" ]; then
            args+=("--ios-$([[ "$IOS" == rel/* ]] && echo branch || echo version)" "$IOS")
          fi
          ./scripts/configure-sdk.sh "${args[@]}"

      - name: Install dependencies
        run: |
          set -euo pipefail

          flutter pub get
          (cd example && flutter pub get)
          (cd example/ios && pod update KlaviyoCore KlaviyoSwift KlaviyoForms KlaviyoLocation KlaviyoSwiftExtension)

      - name: Commit pin
        id: commit
        env:
          PIN_PATHS: android/build.gradle android/build.gradle.kts ios/klaviyo_flutter_sdk.podspec ios/klaviyo_flutter_sdk/Package.swift example/ios/Podfile example/ios/Podfile.lock
        run: |
          set -euo pipefail

          read -ra candidates <<< "$PIN_PATHS"
          paths=()
          for path in "${candidates[@]}"; do
            [ -e "$path" ] && paths+=("$path")
          done
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Native pins already match $BRANCH, nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --cached --stat

          pinned=()
          [ -n "$ANDROID" ] && pinned+=("Android SDK to $ANDROID")
          [ -n "$IOS" ] && pinned+=("iOS SDK to $IOS")
          joined=$(IFS=,; echo "${pinned[*]}")
          summary=${joined//,/, }
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

          git commit -m "chore: pin $summary"
          git push origin "HEAD:refs/heads/$PIN_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pin PR
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.X_REPO_PAT }}
          SUMMARY: ${{ steps.commit.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          body=$(printf 'Pins the native SDKs on `%s`: %s.\n\nOpened by [Release Branch](%s).' "$BRANCH" "$SUMMARY" "$RUN_URL")
          title="chore: pin native SDKs for $VERSION"

          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PIN_BRANCH" --base "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$url" ]; then
            gh pr edit "$url" --body "$body"
          else
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BRANCH" --head "$PIN_BRANCH" --title "$title" --body "$body")
          fi
          echo "Pin PR: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify Slack of pin PR
        if: success() && steps.pr.outputs.url
        timeout-minutes: 2
        continue-on-error: true
        uses: klaviyo/klaviyo-react-native-sdk/.github/shared/notify-slack@master
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: success
          title: ${{ env.SLACK_USERNAME }} native pins for `${{ needs.rel_branch.outputs.branch }}` opened
          fields: |
            Pinned: ${{ steps.commit.outputs.summary }}
            Triggered by: `${{ needs.rel_branch.outputs.triggered_by }}`
          links: |
            Pull request|${{ steps.pr.outputs.url }}

      - name: Notify Slack of pin failure
        if: failure()
        timeout-minutes: 2
        continue-on-error: true
        uses: klaviyo/klaviyo-react-native-sdk/.github/shared/notify-slack@master
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: failure
          title: ${{ env.SLACK_USERNAME }} native pins for `${{ needs.rel_branch.outputs.branch }}` could not be opened
          fields: |
            Triggered by: `${{ needs.rel_branch.outputs.triggered_by }}`
