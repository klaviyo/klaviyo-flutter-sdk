# Publishes the example app to the Play internal track and TestFlight.
#
# Triggers:
#   - push to master / rel/**, release: published  -> both platforms, only when
#     the repo variable EXAMPLE_APP_PUBLISH_ENABLED is 'true'
#   - workflow_dispatch -> chosen platform(s); ignores the variable. With
#     check_credentials set, no builds: each platform job instead verifies its
#     store credentials are usable (read-only) and reports.
#   - pull_request touching publish files -> dry run: script tests plus
#     unsigned release builds, no store access and no secrets
#
# Logs are public: pass secrets via env only, never echo them or enable `set -x`.
# See .github/scripts/README.md for the required secrets and setup.

name: publish-example

on:
  push:
    branches:
      - master
      - 'rel/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to publish
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      check_credentials:
        description: Only verify store credentials are usable; do not build or upload
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/publish-example.yml'
      - '.github/actions/notify-slack-publish/**'
      - '.github/scripts/**'
      - 'example/ios/fastlane/**'
      - 'example/android/app/build.gradle'

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.38.7
  ANDROID_PACKAGE: com.klaviyo.flutterexample
  IOS_BUNDLE_ID: com.klaviyo.FlutterExample
  GRADLE_OPTS: -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000

jobs:
  dry-run-scripts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'

      - name: Lint scripts
        run: |
          shellcheck .github/scripts/*.sh .github/scripts/tests/*.sh
          ruby -c .github/scripts/asc.rb
          ruby -c example/ios/fastlane/Fastfile

      - name: Lint workflow files
        run: |
          curl -sSLo actionlint https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            && tar xzf actionlint actionlint
          ./actionlint .github/workflows/publish-example.yml

      - name: Test retry loops and release notes
        run: .github/scripts/tests/test-publish-scripts.sh

      - name: Test SDK ref resolution
        run: .github/scripts/tests/test-sdk-ref.sh

      - name: Test JitPack retry wrapper
        run: .github/scripts/tests/test-gradle-retry.sh

      - name: Test App Store Connect helper
        run: ruby .github/scripts/tests/test-asc.rb

  dry-run-android:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Placeholder config, as in build-android.yml; the real file comes from
      # the GOOGLE_SERVICES_JSON secret at publish time.
      - name: Create placeholder Firebase config
        run: |
          jq -n --arg pkg "$ANDROID_PACKAGE" '{
            project_info: {project_number: "123456789000", project_id: "klaviyo-flutter-sdk-example-ci"},
            client: [{
              client_info: {mobilesdk_app_id: "1:123456789000:android:abc123def456ci", android_client_info: {package_name: $pkg}},
              oauth_client: [],
              api_key: [{current_key: "AIzaSyDummyKeyForCIBuildOnly1234567890123"}],
              services: {appinvite_service: {other_platform_oauth_client: []}}
            }],
            configuration_version: "1"
          }' > example/android/app/google-services.json

      # Same command as the publish job, minus signing (falls back to the
      # debug key when key.properties is absent).
      - name: Build release App Bundle
        working-directory: example
        run: |
          flutter pub get
          ../scripts/sdk-ref.sh
          ../.github/scripts/gradle-retry.sh flutter build appbundle --release --build-number=4242 --dart-define-from-file=build-info.json
          test -f build/app/outputs/bundle/release/app-release.aab

  dry-run-ios:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Unsigned release archive: same Release configuration and build-number
      # plumbing as the publish job, without match or App Store Connect.
      - name: Build unsigned release archive
        working-directory: example
        run: |
          flutter pub get
          ../scripts/sdk-ref.sh
          flutter build ipa --release --no-codesign --build-number=4242 --dart-define-from-file=build-info.json
          PLIST=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = 4242

  verify:
    if: github.event_name != 'pull_request' && inputs.check_credentials != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze and test the plugin
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Analyze and test the example app
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  deploy-android:
    name: Publish to Play internal track
    needs: verify
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.platform != 'ios')
      || ((github.event_name == 'push' || github.event_name == 'release') && vars.EXAMPLE_APP_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-24.04
    environment: android-internal-track
    concurrency:
      group: publish-example-android-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set source label
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            source_label="release $RELEASE_TAG"
          else
            source_label="$REF_NAME"
          fi
          echo "SOURCE_LABEL=$(printf '%s' "$source_label" | tr -cd 'A-Za-z0-9._/ +-')" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate build info
        run: |
          ./scripts/sdk-ref.sh
          SDK_INFO="$(jq -r '"Flutter: \(.flutterSdkRef) · iOS: \(.iosSdkRef) · Android: \(.androidSdkRef)"' example/build-info.json)"
          {
            echo "SDK_INFO=$SDK_INFO"
            echo "SDK_VERSION=$(jq -r .sdkVersion example/build-info.json)"
            echo "SHORT_SHA=$(jq -r .commitShort example/build-info.json)"
          } >> "$GITHUB_ENV"

      - name: Write Firebase config and signing keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in GOOGLE_SERVICES_JSON SIGNING_KEY ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set. See .github/scripts/README.md."
              exit 1
            fi
          done
          printf '%s' "$GOOGLE_SERVICES_JSON" > example/android/app/google-services.json
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Read by example/android/app/build.gradle's release signingConfig.
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > example/android/key.properties

      - name: Check credentials only
        if: inputs.check_credentials == true
        env:
          PACKAGE_NAME: ${{ env.ANDROID_PACKAGE }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -alias "$ALIAS" \
            -storepass "$KEY_STORE_PASSWORD" -keypass "$KEY_PASSWORD" >/dev/null
          echo "Keystore opens and contains the '$ALIAS' alias"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Check Play API access only
        if: inputs.check_credentials == true
        env:
          PACKAGE_NAME: ${{ env.ANDROID_PACKAGE }}
        run: |
          next="$(.github/scripts/play-publish.sh next-version-code)"
          echo "Play API is reachable; highest versionCode seen: $((next - 1))"

      - name: Prepare release notes
        if: inputs.check_credentials != true
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_NAME: ${{ github.event.release.name }}
          GIT_REF_NAME: ${{ env.SOURCE_LABEL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          printf '%s' "$RELEASE_BODY" > "$RUNNER_TEMP/release-body.txt"
          # Play caps release notes at 500 characters per locale; the CI run
          # link only fits TestFlight's 4000.
          BUILD_INFO=example/build-info.json \
            .github/scripts/release-notes.sh 500 "$RUNNER_TEMP/release-body.txt" > "$RUNNER_TEMP/play-notes.txt"
          cat "$RUNNER_TEMP/play-notes.txt"

      - name: Build and upload (retries on versionCode conflict)
        if: inputs.check_credentials != true
        working-directory: example
        env:
          PACKAGE_NAME: ${{ env.ANDROID_PACKAGE }}
          AAB_PATH: build/app/outputs/bundle/release/app-release.aab
          NOTES_FILE: ${{ runner.temp }}/play-notes.txt
          PLAY_TRACK: internal
          # Play only accepts 'draft' releases until the app's first manual rollout.
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          RELEASE_NAME: ${{ env.SDK_VERSION }} (${{ env.VERSION_CODE }}) ${{ env.SHORT_SHA }}
        run: |
          flutter pub get
          # shellcheck disable=SC2016
          ../.github/scripts/play-publish.sh deploy -- \
            bash -c '../.github/scripts/gradle-retry.sh flutter build appbundle --release --build-name="$SDK_VERSION" --build-number="$VERSION_CODE" --dart-define-from-file=build-info.json'

      # Uploads the published bundle to Internal App Sharing for the Slack
      # install link; a sharing failure must not fail a deploy that landed.
      - name: Upload to Internal App Sharing
        if: success() && inputs.check_credentials != true
        id: internal_sharing
        continue-on-error: true
        env:
          PACKAGE_NAME: ${{ env.ANDROID_PACKAGE }}
          AAB_PATH: example/build/app/outputs/bundle/release/app-release.aab
        run: echo "url=$(.github/scripts/play-publish.sh share)" >> "$GITHUB_OUTPUT"

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" example/android/key.properties

      - name: Notify Slack on success
        if: success() && inputs.check_credentials != true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          platform: Play Store internal track
          version_label: ${{ env.SDK_VERSION }} (${{ env.VERSION_CODE }})
          source_label: ${{ env.SOURCE_LABEL }}
          sdk_info: ${{ env.SDK_INFO }}
          # Internal App Sharing when the upload worked; otherwise the
          # internal-track link, which only resolves for Google accounts on
          # the internal testers list.
          access_url: ${{ steps.internal_sharing.outputs.url || format('https://play.google.com/apps/test/{0}/{1}', env.ANDROID_PACKAGE, env.VERSION_CODE) }}
          access_label: Install from Play (internal testers)
          install_notes: Install ${{ env.SDK_VERSION }} (${{ env.VERSION_CODE }}) with a Google account on the internal testers list.

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          platform: Play Store internal track
          version_label: ${{ env.SDK_VERSION || '?' }} (${{ env.VERSION_CODE || '?' }})
          source_label: ${{ env.SOURCE_LABEL }}
          sdk_info: ${{ env.SDK_INFO }}

  deploy-ios:
    name: Publish to TestFlight
    needs: verify
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.platform != 'android')
      || ((github.event_name == 'push' || github.event_name == 'release') && vars.EXAMPLE_APP_PUBLISH_ENABLED == 'true')
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    concurrency:
      group: publish-example-ios-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    outputs:
      build_number: ${{ env.BUILD_NUMBER }}
      marketing_version: ${{ env.SDK_VERSION }}
      sdk_info: ${{ env.SDK_INFO }}
      source_label: ${{ env.SOURCE_LABEL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set source label
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            source_label="release $RELEASE_TAG"
          else
            source_label="$REF_NAME"
          fi
          echo "SOURCE_LABEL=$(printf '%s' "$source_label" | tr -cd 'A-Za-z0-9._/ +-')" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate build info
        run: |
          ./scripts/sdk-ref.sh
          SDK_INFO="$(jq -r '"Flutter: \(.flutterSdkRef) · iOS: \(.iosSdkRef) · Android: \(.androidSdkRef)"' example/build-info.json)"
          echo "SDK_INFO=$SDK_INFO" >> "$GITHUB_ENV"
          echo "SDK_VERSION=$(jq -r .sdkVersion example/build-info.json)" >> "$GITHUB_ENV"

      # Runs before setup-ruby so pod install uses the runner's own CocoaPods.
      # The build number here is a placeholder; build_ipa passes the real one
      # to xcodebuild on every attempt.
      - name: Generate Flutter config and install pods
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --release --config-only --no-codesign \
            --build-name="$SDK_VERSION" --build-number=1 \
            --dart-define-from-file=build-info.json

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -v 2.237.0 --no-document

      # altool and asc.rb both find the key at this conventional path.
      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "::error::App Store Connect API key secrets are not set. See .github/scripts/README.md."
            exit 1
          fi
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Resolve next build number from App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: ${{ env.IOS_BUNDLE_ID }}
        run: echo "INITIAL_BUILD_NUMBER=$(ruby .github/scripts/asc.rb next-build-number)" >> "$GITHUB_ENV"

      - name: Check credentials only
        if: inputs.check_credentials == true
        run: |
          echo "ASC API key accepted; next build number would be $INITIAL_BUILD_NUMBER"

      - name: Check match repo is readable
        if: inputs.check_credentials == true
        working-directory: example/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          MATCH_READONLY: "true"
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          printf '%s\n' "$MATCH_DEPLOY_KEY" | ssh-add - 2>/dev/null
          git ls-remote git@github.com:klaviyo/mobile-certificates.git HEAD >/dev/null
          echo "match repository is readable with the deploy key"

      - name: Install signing identity and build, upload (retries on build number conflict)
        if: inputs.check_credentials != true
        working-directory: example/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: ${{ env.IOS_BUNDLE_ID }}
          IPA_PATH: ${{ github.workspace }}/example/build/ios/ipa/Runner.ipa
          NEXT_BUILD_NUMBER_CMD: ruby ${{ github.workspace }}/.github/scripts/asc.rb next-build-number
        run: |
          for name in MATCH_PASSWORD MATCH_DEPLOY_KEY BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set. See .github/scripts/README.md."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          printf '%s\n' "$MATCH_DEPLOY_KEY" | ssh-add - 2>/dev/null
          CERT_P12_PATH="$RUNNER_TEMP/dist.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -d > "$CERT_P12_PATH"
          export CERT_P12_PATH
          fastlane ios install_signing
          # shellcheck disable=SC2016
          ../../.github/scripts/testflight-publish.sh "$INITIAL_BUILD_NUMBER" -- \
            bash -c 'fastlane ios build_ipa build_number:"$BUILD_NUMBER"'

      - name: Clean up signing material
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/dist.p12"

      - name: Notify Slack on success
        if: success() && inputs.check_credentials != true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          platform: TestFlight
          version_label: ${{ env.SDK_VERSION }} (${{ env.BUILD_NUMBER }})
          source_label: ${{ env.SOURCE_LABEL }}
          sdk_info: ${{ env.SDK_INFO }}
          # Requires an App Store Connect login; testers install via the TestFlight app.
          access_url: https://appstoreconnect.apple.com/apps/${{ env.ASC_APP_ID }}/testflight/ios
          access_label: TestFlight in App Store Connect
          install_notes: Install ${{ env.SDK_VERSION }} (${{ env.BUILD_NUMBER }}) from the TestFlight app once Apple finishes processing it, usually in 5 to 30 minutes. Not a tester yet? Ask in #mobile-push-team to be added, and give them your Apple ID email.

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          platform: TestFlight
          version_label: ${{ env.SDK_VERSION || '?' }} (${{ env.BUILD_NUMBER || env.INITIAL_BUILD_NUMBER || '?' }})
          source_label: ${{ env.SOURCE_LABEL }}
          sdk_info: ${{ env.SDK_INFO }}

  what-to-test:
    name: Set TestFlight "What to Test"
    needs: deploy-ios
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "::error::App Store Connect API key secrets are not set. See .github/scripts/README.md."
            exit 1
          fi
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Set TestFlight "What to Test"
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_NAME: ${{ github.event.release.name }}
          GIT_REF_NAME: ${{ needs.deploy-ios.outputs.source_label }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: ${{ env.IOS_BUNDLE_ID }}
          BUILD_NUMBER: ${{ needs.deploy-ios.outputs.build_number }}
        run: |
          printf '%s' "$RELEASE_BODY" > "$RUNNER_TEMP/release-body.txt"
          # TestFlight allows 4000 characters.
          .github/scripts/release-notes.sh 4000 "$RUNNER_TEMP/release-body.txt" > "$RUNNER_TEMP/testflight-notes.txt"
          cat "$RUNNER_TEMP/testflight-notes.txt"
          ruby .github/scripts/asc.rb set-whats-new "$BUILD_NUMBER" "$RUNNER_TEMP/testflight-notes.txt"

      - name: Clean up signing material
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          platform: TestFlight "What to Test"
          version_label: ${{ needs.deploy-ios.outputs.marketing_version }} (${{ needs.deploy-ios.outputs.build_number }})
          source_label: ${{ needs.deploy-ios.outputs.source_label }}
          sdk_info: ${{ needs.deploy-ios.outputs.sdk_info }}
          install_notes: The build itself is on TestFlight; only the "What to Test" notes failed to save.
