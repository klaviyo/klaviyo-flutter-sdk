name: release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      slack_ts:
        description: Slack message ts to update with the result. Set by publish-release.yml; leave empty to post a new message
        type: string
        required: false
        default: ''
      triggered_by:
        description: Login of the person who started this run. Set by publish-release.yml; leave empty to use the actor
        type: string
        required: false
        default: ''

env:
  TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'schedule' || inputs.triggered_by || (endsWith(github.triggering_actor || github.actor, '[bot]') && format('{0} (automation)', github.workflow) || github.triggering_actor || github.actor) }}
  SLACK_USERNAME: Flutter SDK
  SLACK_ICON_EMOJI: ':merlin-orb-flutter:'

jobs:
  # Posts the live Slack message when this run was started without one
  # (tag push from the GitHub UI). publish-release.yml passes slack_ts, which
  # skips this job and keeps that message as the one that gets edited.
  announce:
    if: startsWith(github.ref, 'refs/tags/') && inputs.slack_ts == ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      slack_ts: ${{ steps.slack.outputs.ts }}
    steps:
      - name: Checkout Slack action
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Short commit
        id: sha
        env:
          SHA: ${{ github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack release awaiting approval
        id: slack
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: pending
          title: Flutter SDK `${{ github.ref_name }}` awaiting `pub.dev` approval
          body: Approve the `pub.dev` environment on this run. This message updates with the result.
          fields: |
            Version: `${{ github.ref_name }}`
            Commit: `${{ steps.sha.outputs.short }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
          links: |
            Approve here|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

  validate:
    runs-on: macos-15
    outputs:
      already_live: ${{ steps.pubdev.outputs.already_live }}
    steps:
      - name: Verify running from a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Error: This workflow must be run from a tag, not a branch."
          echo "When using 'Run workflow', select a tag from the Tags tab."
          exit 1

      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Check native SDK pins
        run: ./.github/scripts/check-native-pins.sh

      - name: Check version and CHANGELOG match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          raw=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [ "$raw" != "$TAG" ]; then
            echo "::error::pubspec.yaml version is '${raw}', but the tag is ${TAG}"
            exit 1
          fi
          if ! grep -Eq "^## \[?${TAG//./\\.}\]?([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${TAG}' entry"
            exit 1
          fi

      - name: Check if the version is already on pub.dev
        id: pubdev
        env:
          TAG: ${{ github.ref_name }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/klaviyo_flutter_sdk/versions/${TAG}" || true)
          if [ "$status" = "200" ]; then
            echo "::notice::klaviyo_flutter_sdk ${TAG} is already live on pub.dev; the upload will be skipped"
            echo "already_live=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_live=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: validate
    if: needs.validate.outputs.already_live != 'true'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev

  verify:
    needs: [validate, publish]
    if: "!cancelled() && (needs.validate.outputs.already_live == 'true' || needs.publish.result == 'success')"
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Wait for the version on pub.dev
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          url="https://pub.dev/api/packages/klaviyo_flutter_sdk/versions/${VERSION}"
          for attempt in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$status" = "200" ]; then
              echo "klaviyo_flutter_sdk ${VERSION} is live on pub.dev"
              exit 0
            fi
            echo "Attempt ${attempt}/20: pub.dev returned ${status}"
            if [ "$attempt" -lt 20 ]; then
              sleep 15
            fi
          done
          echo "::error::klaviyo_flutter_sdk ${VERSION} did not appear on pub.dev within 5 minutes"
          exit 1

  linear-release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync release to Linear
        id: linear-sync
        continue-on-error: true
        uses: linear/linear-release-action@dd4fc407f860b9460d2cf0b3fb1edd8985cf443f # v0.18.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

      - name: Complete release in Linear
        if: steps.linear-sync.outcome == 'success'
        continue-on-error: true
        uses: linear/linear-release-action@dd4fc407f860b9460d2cf0b3fb1edd8985cf443f # v0.18.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ github.ref_name }}

  # Publishes the GitHub release after pub.dev has the version, then
  # dispatches publish-example.yml. The dispatch path leaves the release a
  # draft (a GITHUB_TOKEN publish fires no events, so the example deploy is
  # dispatched); a release published in the UI fires release: published
  # itself, so nothing here runs.
  finalize:
    needs: [announce, verify]
    if: "!cancelled() && needs.verify.result == 'success' && startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          latest=true
          if [ "$PRERELEASE" = "true" ]; then
            latest=false
          fi
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo "missing")
          case "$state" in
            missing)
              echo "No release for ${TAG}; creating one"
              flags=(--title "$TAG" --generate-notes "--latest=${latest}")
              if [ "$PRERELEASE" = "true" ]; then
                flags+=(--prerelease)
              fi
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" CHANGELOG.md
              echo "action=created" >> "$GITHUB_OUTPUT"
              ;;
            draft)
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "--prerelease=${PRERELEASE}" "--latest=${latest}"
              echo "action=published-draft" >> "$GITHUB_OUTPUT"
              ;;
            published)
              echo "::notice::Release ${TAG} is already published (UI path); nothing to do"
              echo "action=already-published" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # A release published with GITHUB_TOKEN does not fire
      # release: published, so the example deploy is dispatched explicitly.
      # On the UI path the release: published event already started it.
      - name: Dispatch the example app deploy
        if: steps.release.outputs.action != 'already-published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SLACK_TS: ${{ inputs.slack_ts || needs.announce.outputs.slack_ts }}
        run: |
          # True when the workflow file at $TAG declares the input named by $1.
          takes_input() {
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/publish-example.yml?ref=$TAG" \
              -H "Accept: application/vnd.github.raw" | grep -q "^[[:space:]]*$1:"
          }
          args=()
          if [ -n "$SLACK_TS" ] && takes_input slack_thread_ts; then
            args+=(-f "slack_thread_ts=$SLACK_TS")
          fi
          if takes_input triggered_by; then
            args+=(-f "triggered_by=$TRIGGERED_BY")
          fi
          gh workflow run publish-example.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f platform=both "${args[@]}"

      - name: Dispatch next release branch
        if: ${{ !cancelled() && steps.release.outcome == 'success' && !contains(env.VERSION, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run rel-branch.yml --repo "$GITHUB_REPOSITORY" --ref master -f "base=$VERSION" -f "triggered_by=$TRIGGERED_BY"
          echo "Dispatched rel-branch.yml from $VERSION"

  notify:
    needs: [announce, validate, publish, verify, finalize]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Slack action
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Summarize result
        id: result
        env:
          VALIDATE: ${{ needs.validate.result }}
          PUBLISH: ${{ needs.publish.result }}
          VERIFY: ${{ needs.verify.result }}
          FINALIZE: ${{ needs.finalize.result }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          result=""
          failed=""
          if [ "$VALIDATE" != "success" ]; then
            result=failure
            failed="validate (${VALIDATE})"
          elif [ "$PUBLISH" = "cancelled" ]; then
            result=stopped
            failed="pub.dev approval cancelled"
          elif [ "$PUBLISH" != "success" ] && [ "$PUBLISH" != "skipped" ]; then
            # A rejected environment approval fails the job before its steps run.
            steps=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
              --jq '[.jobs[] | select(.name == "publish" or (.name | startswith("publish / "))) | .steps | length] | add // 0' || echo "unknown")
            if [ "$steps" = "0" ]; then
              result=stopped
              failed="pub.dev approval rejected"
            else
              result=failure
              failed="publish (${PUBLISH})"
            fi
          elif [ "$VERIFY" != "success" ] && { [ "$VERIFY" != "skipped" ] || [ "$PUBLISH" = "success" ]; }; then
            result=failure
            failed="pub.dev verify (${VERIFY})"
          elif [ "$FINALIZE" != "success" ] && [ "$FINALIZE" != "skipped" ]; then
            result=failure
            failed="finalize (${FINALIZE})"
          else
            result=success
          fi
          {
            echo "result=${result}"
            echo "failed_step=${failed}"
            echo "commit_short=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        id: slack
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ inputs.slack_ts || needs.announce.outputs.slack_ts }}
          status: ${{ steps.result.outputs.result }}
          title: Flutter SDK `${{ github.ref_name }}` ${{ steps.result.outputs.result == 'success' && 'published to `pub.dev`' || steps.result.outputs.result == 'stopped' && 'release stopped' || 'release failed' }}
          body: ${{ steps.result.outputs.result == 'success' && (inputs.slack_ts != '' || needs.announce.outputs.slack_ts != '') && 'The example app deploy replies in this thread.' || '' }}
          fields: |
            Version: `${{ github.ref_name }}`
            Commit: `${{ steps.result.outputs.commit_short }}`
            Event: `${{ github.event_name }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
          links: |
            Release|${{ steps.result.outputs.release_url }}
            pub.dev|${{ steps.result.outputs.result == 'success' && format('https://pub.dev/packages/klaviyo_flutter_sdk/versions/{0}', github.ref_name) || '' }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      - name: Reply with failure details
        if: steps.result.outputs.result != 'success' && steps.slack.outputs.ts != ''
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ steps.slack.outputs.ts }}
          status: ${{ steps.result.outputs.result }}
          title: ${{ steps.result.outputs.result == 'stopped' && 'Stopped:' || 'Failed at' }} `${{ steps.result.outputs.failed_step }}`
          body: Tag `${{ github.ref_name }}` kept. Run `release.yml` at the tag to retry.
          fields: |
            Triggered by: `${{ env.TRIGGERED_BY }}`
