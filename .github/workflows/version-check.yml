name: version-check

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify-version-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The sync regenerates example/pubspec.lock with flutter pub get, so Flutter has to be on the runner
      # or the drift check below would compare an untouched lockfile against itself.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.38.7
          cache: true

      - name: Run version sync script
        run: ./scripts/sync_version.sh

      - name: Check for drift
        run: |
          files=(
            ios/klaviyo_flutter_sdk/Sources/klaviyo_flutter_sdk/klaviyo-sdk-configuration.plist
            example/pubspec.yaml
            example/pubspec.lock
            example/ios/Runner.xcodeproj/project.pbxproj
          )
          if ! git diff --exit-code "${files[@]}"; then
            echo "::error::Files synced from pubspec.yaml are out of date. Run ./scripts/sync_version.sh and commit the result."
            exit 1
          fi
