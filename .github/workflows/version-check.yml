name: version-check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify-version-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run version sync script
        run: ./scripts/sync_version.sh

      - name: Check for drift
        run: |
          files=(
            ios/klaviyo_flutter_sdk/Sources/klaviyo_flutter_sdk/klaviyo-sdk-configuration.plist
            example/pubspec.yaml
            example/ios/Runner.xcodeproj/project.pbxproj
          )
          if ! git diff --exit-code "${files[@]}"; then
            echo "::error::Files synced from pubspec.yaml are out of date. Run ./scripts/sync_version.sh and commit the result."
            exit 1
          fi
