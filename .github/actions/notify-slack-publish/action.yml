name: Notify Slack of a publish result
description: Posts a Slack message summarizing an example app or SDK publish job (success or failure).
inputs:
  webhook:
    description: Slack incoming webhook URL; empty skips the notification
    required: true
  result:
    description: "'success', 'failure' or 'warning', drives icon and headline"
    required: true
  platform:
    description: "Store label (e.g. 'TestFlight', 'Play internal'); unused when title is set"
    required: false
    default: ''
  os:
    description: "iOS or Android, for the headline; unused when title is set"
    required: false
    default: ''
  title:
    description: >-
      Headline subject, e.g. "klaviyo_flutter_sdk 0.4.0 → pub.dev". Defaults to
      "Flutter Example (<os>) → <platform>".
    required: false
    default: ''
  version_heading:
    description: Label for the version_label line
    required: false
    default: Build
  release_url:
    description: GitHub release page to link
    required: false
    default: ''
  version_label:
    description: "Full version with build number, e.g. '0.3.2-alpha.1 (42)'"
    required: false
    default: ''
  sdk_info:
    description: >-
      Pre-formatted SDK line, e.g. "Flutter 0.3.2 · feat/x@0123456 | iOS
      5.4.1" (from the build-info fixture format).
    required: false
    default: ''
  source_label:
    description: Sanitized source label (source-label.sh)
    required: false
    default: ''
  event_name:
    description: github.event_name
    required: false
    default: ''
  commit_sha:
    description: >-
      Commit to show and link (pass github.event.pull_request.head.sha || github.sha)
    required: false
    default: ''
  commit_short:
    description: "The 7-char sha, computed in a shell step (expressions cannot slice)"
    required: false
    default: ''
  failed_step:
    description: Name of the step that failed, for failure messages
    required: false
    default: an unknown step
  access_url:
    description: >-
      Where testers get the build. This repo is public, so only pass links
      that need an authorized tester / App Store Connect account to resolve;
      never a direct artifact or public TestFlight link.
    required: false
    default: ''
  access_label:
    description: Link text for access_url
    required: false
    default: Get the build
  install_notes:
    description: Install guidance shown when there is no access_url or after it
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Skip when no webhook is configured
      if: inputs.webhook == ''
      shell: bash
      run: echo "::notice::SLACK_WEBHOOK_URL is not set; skipping Slack notification"

    - name: Build Slack payload
      id: payload
      if: inputs.webhook != ''
      continue-on-error: true
      shell: bash
      env:
        RESULT: ${{ inputs.result }}
        OS: ${{ inputs.os }}
        PLATFORM: ${{ inputs.platform }}
        TITLE: ${{ inputs.title }}
        VERSION_HEADING: ${{ inputs.version_heading }}
        RELEASE_URL: ${{ inputs.release_url }}
        VERSION_LABEL: ${{ inputs.version_label }}
        SDK_INFO: ${{ inputs.sdk_info }}
        SOURCE_LABEL: ${{ inputs.source_label }}
        EVENT_NAME: ${{ inputs.event_name }}
        COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        COMMIT_SHORT: ${{ inputs.commit_short }}
        FAILED_STEP: ${{ inputs.failed_step }}
        ACCESS_URL: ${{ inputs.access_url }}
        ACCESS_LABEL: ${{ inputs.access_label }}
        INSTALL_NOTES: ${{ inputs.install_notes }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: ${{ github.action_path }}/../../scripts/slack-payload.sh > "$RUNNER_TEMP/slack-payload.json"

    - if: inputs.webhook != '' && steps.payload.outcome == 'success'
      uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload-file-path: ${{ runner.temp }}/slack-payload.json
