group 'com.klaviyo.klaviyo_flutter_sdk'
version '1.0'

buildscript {
    ext.kotlin_version = '2.3.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'

// Built-in Kotlin migration (AGP 9): AGP 9 removes support for applying the Kotlin Gradle
// Plugin (KGP) directly and provides built-in Kotlin instead. Apply KGP only when built-in
// Kotlin is NOT active — i.e. on AGP < 9, or when `android.builtInKotlin` is disabled (the
// Flutter transition default, which Flutter still sets to false even on AGP 9). This keeps the
// plugin building across both the legacy-KGP and built-in-Kotlin paths without forcing a
// Flutter SDK bump, and stops applying KGP once the host enables built-in Kotlin on AGP 9+.
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty('android.builtInKotlin').map { it.toBoolean() }.orElse(agpMajor >= 9).get()
if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    // compileSdk 35: required by transitive androidx dependencies (e.g. androidx.webkit,
    // androidx.window) under AGP 9's stricter AAR-metadata check, which fails the build on
    // compileSdk 33. Does not change minSdk (23) or runtime behavior.
    compileSdkVersion 35
    namespace 'com.klaviyo.klaviyo_flutter_sdk'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
    }
}

// Replaces the deprecated `kotlinOptions { jvmTarget = ... }` block, which is removed
// alongside KGP under built-in Kotlin. The `kotlin` extension is registered by KGP on
// AGP < 9 and by built-in Kotlin on AGP 9+, so this configures the Kotlin compiler on both.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

def klaviyoSdkVersion = "4.4.0"

// Whether to include the full forms module (in-app forms rendering).
// Set klaviyoIncludeForms=false in your host app's gradle.properties to exclude forms.
def includeForms = true
if (rootProject.hasProperty('klaviyoIncludeForms')) {
    includeForms = rootProject.getProperty('klaviyoIncludeForms').toBoolean()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.github.klaviyo.klaviyo-android-sdk:core:$klaviyoSdkVersion"
    api "com.github.klaviyo.klaviyo-android-sdk:analytics:$klaviyoSdkVersion"
    api "com.github.klaviyo.klaviyo-android-sdk:push-fcm:$klaviyoSdkVersion"

    // Location: full module (includes -core transitively), or just -core for lightweight
    def includeLocation = false
    if (rootProject.hasProperty('klaviyoIncludeLocation')) {
        includeLocation = rootProject.getProperty('klaviyoIncludeLocation').toBoolean()
    }

    if (includeLocation) {
        api "com.github.klaviyo.klaviyo-android-sdk:location:$klaviyoSdkVersion"
    } else {
        implementation "com.github.klaviyo.klaviyo-android-sdk:location-core:$klaviyoSdkVersion"
    }

    // Forms: full module (includes -core transitively), or just -core for lightweight
    if (includeForms) {
        api "com.github.klaviyo.klaviyo-android-sdk:forms:$klaviyoSdkVersion"
    } else {
        implementation "com.github.klaviyo.klaviyo-android-sdk:forms-core:$klaviyoSdkVersion"
    }

    implementation "com.google.firebase:firebase-messaging:24.1.0"
}
